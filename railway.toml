[deploy]
# Uses Nixpacks auto-detection (Python + requirements.txt)
# Start command from Procfile: python visualization/serve.py
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Volume mount for persistent experiment data
# Create volume in Railway dashboard and mount at /app/experiments
# Then run: railway run bash utils/railway_sync_r2.sh (one-time setup)
